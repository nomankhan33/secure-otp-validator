<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --primary-color: #ffffff;
            --accent-color: #4facfe;
            --text-color: #ffffff;
        }

        ::selection {
            background: transparent;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            overflow: hidden;
        }

        .background-blobs {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite ease-in-out;
        }

        .blob-1 {
            top: 20%;
            left: 20%;
            width: 300px;
            height: 300px;
            background: #ff00cc;
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: 20%;
            right: 20%;
            width: 350px;
            height: 350px;
            background: #3333ff;
            animation-delay: 2s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, 50px);
            }
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 360px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .otp-inputs input {
            width: 50px;
            height: 60px;
            font-size: 24px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .otp-inputs input:focus {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(255, 51, 133, 0.5);
            transform: scale(1.05);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 51, 133, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            color: #ff6b6b;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        /* SECOND SCREEN */
        .pin-screen {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .pin {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(90deg, #f83600 0%, #f9d423 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 20px;
            letter-spacing: 4px;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        button .btn-text {
            display: inline;
        }

        .team-message {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #00f2fe;
            /* Vibrant Cyan */
            text-transform: uppercase;
            line-height: 1.4;
            letter-spacing: 2px;
            display: none;
            /* Hidden by default */
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div id="teamMessage" class="team-message"></div>
    <div class="clue-message">Clue : # The light of candle will guide you to the Gold</div>

    <div class="container">

        <!-- SCREEN 1 : OTP -->
        <div id="otpScreen">
            <h2>Security Check</h2>
            <p style="font-size: 14px; opacity: 0.8; margin-bottom: 20px;">Enter the 3-digit access code</p>

            <div class="otp-inputs">
                <input type="text" maxlength="1" pattern="\d*" inputmode="numeric">
                <input type="text" maxlength="1" pattern="\d*" inputmode="numeric">
                <input type="text" maxlength="1" pattern="\d*" inputmode="numeric">
            </div>

            <button onclick="submitPin()">
                <span class="btn-text">Unlock</span>
                <div class="loader"></div>
            </button>
            <div class="error" id="errorMsg">Incorrect Access Code</div>
        </div>

        <!-- SCREEN 2 : NEW PIN -->
        <div id="pinScreen" class="pin-screen">
            <h2>Access Granted</h2>
            <p style="font-size: 16px; opacity: 0.9; margin-bottom: 10px;">Find the Bag in the Main Cabin and unlock
                your Treasure</p>
            <div class="pin">----</div>
        </div>
    </div>



    <script>
        // Check URL for Team Messages
        const path = window.location.pathname;
        const teamMsg = document.getElementById('teamMessage');

        if (path === '/1') {
            teamMsg.innerText = "Team A\nGo to Room No - 1";
            teamMsg.style.display = 'block';
        } else if (path === '/2') {
            teamMsg.innerText = "Team B\nGo to Room No - 2";
            teamMsg.style.display = 'block';
        }

        const inputs = document.querySelectorAll('.otp-inputs input');

        inputs.forEach((input, index) => {
            // Handle keydown for backspace and overwriting
            input.addEventListener('keydown', (e) => {
                const errorMsg = document.getElementById("errorMsg");
                // Hide error on backspace or valid number
                if (e.key === 'Backspace' || (e.key >= '0' && e.key <= '9')) {
                    if (errorMsg.innerText === "Numbers only please") {
                        errorMsg.style.display = "none";
                    }
                }

                if (e.key === 'Backspace') {
                    if (input.value.length === 0 && index > 0) {
                        e.preventDefault();
                        inputs[index - 1].focus();
                    }
                } else if (e.key >= '0' && e.key <= '9') {
                    // Start fresh if user types a number (overwrite behavior)
                    input.value = '';
                }
            });

            // Handle input for moving to next field
            input.addEventListener('input', (e) => {
                const val = e.data || input.value;
                const errorMsg = document.getElementById("errorMsg");

                // Ensure only digits (extra safety if user pastes)
                if (!/^\d$/.test(val)) {
                    input.value = '';

                    // UX: Show error message
                    errorMsg.innerText = "Numbers only please";
                    errorMsg.style.display = "block";
                    // Trigger shake animation again
                    errorMsg.style.animation = 'none';
                    errorMsg.offsetHeight; /* trigger reflow */
                    errorMsg.style.animation = "shake 0.4s ease-in-out";

                    return;
                }

                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            // Focus prevention - optional but keeps it clean
            input.addEventListener('focus', (e) => {
                e.target.select();
            });
        });

        async function submitPin() {
            let pin = "";
            inputs.forEach(input => pin += input.value);

            const btn = document.querySelector('button');
            const btnText = document.querySelector('.btn-text');
            const loader = document.querySelector('.loader');
            const errorMsg = document.getElementById("errorMsg");

            // Reset UI
            errorMsg.style.display = "none";

            // Strict Validation: Ensure exactly 3 digits
            if (!/^\d{3}$/.test(pin)) {
                errorMsg.innerText = "Incorrect Access Code";
                errorMsg.style.display = "block";
                inputs.forEach(input => input.value = '');
                inputs[0].focus();
                return;
            }

            // Show loading
            btn.disabled = true;
            btnText.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('/verify-otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ pin: pin })
                });

                const data = await response.json();

                if (data.success) {
                    setTimeout(() => { // Artificially smooth out the transition
                        document.getElementById("otpScreen").style.display = "none";
                        document.getElementById("pinScreen").style.display = "block";

                        // Hide Team Message and Clue
                        const teamMsg = document.getElementById('teamMessage');
                        const clueMsg = document.querySelector('.clue-message');
                        if (teamMsg) teamMsg.style.display = 'none';
                        if (clueMsg) clueMsg.style.display = 'none';

                        if (data.secretPin) {
                            document.querySelector(".pin").innerText = data.secretPin;
                        }
                    }, 500);
                } else {
                    errorMsg.innerText = "Incorrect Access Code";
                    errorMsg.style.display = "block";
                    // Reset button
                    btn.disabled = false;
                    btnText.style.display = 'inline';
                    loader.style.display = 'none';
                    // Clear inputs for better UX
                    inputs.forEach(input => input.value = '');
                    inputs[0].focus();
                }
            } catch (error) {
                console.error('Error verifying PIN:', error);
                alert('An error occurred. Please try again.');
                btn.disabled = false;
                btnText.style.display = 'inline';
                loader.style.display = 'none';
            }
        }
    </script>

</body>


</html>
